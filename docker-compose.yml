# Production: API + Caddy (automatic HTTPS). See "Deploy" in README.md.
#   API_DOMAIN=api.example.com docker compose up -d --build
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ASSET_MODE: remote
      INDEX_CACHE_DIR: /data/index_cache
    volumes:
      - index:/data            # index downloaded once, survives restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      start_period: 15m        # first boot downloads + loads the ~650 MB index

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN to the API hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # TLS certificates
    depends_on:
      - api
    restart: unless-stopped

volumes:
  index:
  caddy_data:
